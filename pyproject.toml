[project]
name = "yonder"
version = "3.9.2"
description = "Yonder — travel documents -> AirTrail + AdventureLog."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sqladmin>=0.16",
    "jsonschema>=4.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "jinja2>=3.1",
    "timezonefinder>=6.5",
    "babel>=2.12",
    # Timeline PDF export (HTML/CSS -> PDF). Needs pango + fonts in the image.
    "weasyprint>=62",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.review", "app.trips", "resolve", "extract", "adapters", "adapters.targets", "discover", "discover.resolvers", "planning"]
py-modules = ["rules", "validation"]

[tool.setuptools.package-data]
discover = ["data/*.json"]
planning = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
