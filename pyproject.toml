[project]
name = "yonder"
version = "4.13.2"
description = "Run·dere (formerly Yonder): a self-hosted travel tracker that reads bookings from email, files and web pages and puts them on trips."
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "sqladmin>=0.32.0",
    # sqladmin imports SQLAlchemy's asyncio layer, which needs greenlet; it is
    # not pulled in transitively on every platform, and without it /admin
    # silently fails to mount (test_admin_mounts_including_travellers_regression).
    "greenlet>=3.5.6",
    "jsonschema>=4.21",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    # >=6.21.1: CVE-2026-113786, after PYSEC-2026-4153..4160 (YONDER-297).
    # pypdf parses uploaded PDFs.
    "pypdf>=6.21.4",
    # Declared directly: app/trips/maps.py draws trip maps with it (WeasyPrint
    # also needs it). >=13.0.0: the CVE-2026-1123xx/1128xx image-decoder fixes.
    "pillow>=13.0.0",
    "jinja2>=3.1",
    "timezonefinder>=9.2.0",
    "babel>=2.12",
    # Timeline PDF export (HTML/CSS -> PDF). Needs pango + fonts in the image.
    "weasyprint>=62",
    # Remote MCP server at /mcp (YONDER-108): MCP Streamable HTTP via the
    # official SDK's MCPServer (the 2.x name for FastMCP).
    "mcp>=2.2,<3",
    # AES-256-GCM for per-user integration credentials at rest (SPEC-8 D-151).
    # Already installed with mcp; declared because we use it directly.
    "cryptography>=42",
]

[project.optional-dependencies]
# bandit + pip-audit: the pre-publish check's code and dependency scans
# (scripts/prepublish.py, YONDER-287). Dev-only; the image doesn't install them.
dev = ["pytest>=8.0", "httpx>=0.27", "bandit>=1.7.9", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["app", "app.review", "app.trips", "resolve", "extract", "adapters", "adapters.targets", "discover", "discover.resolvers", "planning"]
py-modules = ["rules", "validation"]

[tool.setuptools.package-data]
discover = ["data/*.json"]
# The bundled airport table (D-147) and its MIT notice.
resolve = ["data/*.json.gz", "data/AIRPORTS-LICENSE"]
planning = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
