[project]
name = "yonder"
version = "4.7.2"
description = "Yonder — travel documents -> AirTrail + AdventureLog."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "sqladmin>=0.16",
    # sqladmin imports SQLAlchemy's asyncio layer, which needs greenlet; it is
    # not pulled in transitively on every platform, and without it /admin
    # silently fails to mount (test_admin_mounts_including_travellers_regression).
    "greenlet>=3.0",
    "jsonschema>=4.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pypdf>=4.0",
    "jinja2>=3.1",
    "timezonefinder>=6.5",
    "babel>=2.12",
    # Timeline PDF export (HTML/CSS -> PDF). Needs pango + fonts in the image.
    "weasyprint>=62",
    # Remote MCP server at /mcp (YONDER-108): MCP Streamable HTTP via the
    # official SDK's MCPServer (the 2.x name for FastMCP).
    "mcp>=2.2,<3",
    # AES-256-GCM for per-user integration credentials at rest (SPEC-8 D-151).
    # Already installed with mcp; declared because we use it directly.
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools]
packages = ["app", "app.review", "app.trips", "resolve", "extract", "adapters", "adapters.targets", "discover", "discover.resolvers", "planning"]
py-modules = ["rules", "validation"]

[tool.setuptools.package-data]
discover = ["data/*.json"]
# The bundled airport table (D-147) and its MIT notice.
resolve = ["data/*.json.gz", "data/AIRPORTS-LICENSE"]
planning = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
