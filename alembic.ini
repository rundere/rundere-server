[alembic]
script_location = alembic
# The repo root on sys.path, so env.py can import `app` from a plain checkout
# (`uv run alembic upgrade head`); the project isn't installed as a package.
prepend_sys_path = .
# Database URL comes from TX_DATABASE_URL (env vars only) — see alembic/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
