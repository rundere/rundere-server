# Accepted pre-publish findings (scripts/prepublish.py, YONDER-287).
#
# Every entry needs a reason. Match as narrowly as you can: a rule plus a path,
# and a fingerprint (from the report) when the finding is one specific value.
# Fields: check, rule, path (glob), fingerprint, where (tree | history | commit),
# reason (required).
#
# [[allow]]
# rule = "private-ipv4"
# path = "app/net_policy.py"
# reason = "The SSRF policy lists the private ranges it refuses."

[[allow]]
rule = "assigned-secret"
path = "tests/test_connections.py"
fingerprint = "22bfa9876dd1"
reason = "A made-up AirTrail token for the connection tests (owner, 2026-10-17); never a real credential."

[[allow]]
rule = "credentials-in-url"
path = "tests/test_prepublish.py"
fingerprint = "85ee99a2a88b"
where = "history"
reason = "An old version of the scanner's own test built a database URL from an f-string whose password part was the literal {RANDOM} template, not a credential (2026-10-19)."
