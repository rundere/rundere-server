# CI (D-21): pytest against the fixture corpus, with an ACCURACY NUMBER in the
# log so a change fixing one airline while breaking another is visible in the
# diff. Ready for when this folder becomes a git repo with a GitHub remote.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lockfile matches pyproject.toml (YONDER-194)
        run: pip install uv && uv lock --check
      - run: pip install .[dev]
      - name: pytest
        run: pytest -q
      - name: accuracy metric
        run: |
          python tests/validate.py | tail -1
          # e.g. "35/35 cases behaved as expected" — the regression contract.

  # YONDER-287: the pre-publish check (scripts/prepublish.py). Report-only until
  # the public-launch steps clear the baseline (YONDER-59); then drop
  # continue-on-error to make it a required gate. The private denylist comes from
  # the PREPUBLISH_DENYLIST secret and is never in the repo.
  prepublish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - name: pre-publish check (current files)
        env:
          PREPUBLISH_DENYLIST: ${{ secrets.PREPUBLISH_DENYLIST }}
        run: python scripts/prepublish.py
