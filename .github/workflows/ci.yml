# CI (D-21): pytest against the fixture corpus, with an ACCURACY NUMBER in the
# log so a change fixing one airline while breaking another is visible in the
# diff.
#
# YONDER-295: read-only token, Actions pinned to commit SHAs (Dependabot keeps
# them current), no checked-out credentials. Runs on `pull_request`, never
# `pull_request_target`, so a fork's PR gets no secrets: the prepublish job then
# runs without the private denylist, and the push to main re-runs it with it.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # this job never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: lockfile matches pyproject.toml (YONDER-194)
        run: pip install uv && uv lock --check
      - run: pip install .[dev]
      - name: pytest
        run: pytest -q
      - name: accuracy metric
        run: |
          python tests/validate.py | tail -1
          # e.g. "35/35 cases behaved as expected" — the regression contract.

  # YONDER-287: the pre-publish check (scripts/prepublish.py). A gate since
  # YONDER-295: the tree is clean, so any blocking finding fails the build. The
  # private denylist comes from the PREPUBLISH_DENYLIST secret, never the repo.
  prepublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # this job never pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - name: pre-publish check (current files)
        env:
          PREPUBLISH_DENYLIST: ${{ secrets.PREPUBLISH_DENYLIST }}
        run: python scripts/prepublish.py
