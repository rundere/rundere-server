# Release: build the image from this repo and publish it to GHCR, so Portainer
# pulls a real versioned artifact instead of a locally-built `yonder:latest`.
#
# Fires on a version tag (the same `vX.Y.Z` tags the release convention already
# pushes), and can be run by hand from the Actions tab (workflow_dispatch) —
# select the tag under "Use workflow from" to (re)publish an existing release,
# e.g. to backfill v2.2.1 which was tagged before this workflow existed.
#
# Push auth uses the built-in GITHUB_TOKEN (packages: write) — no PAT needed to
# PUSH. Portainer PULLS the (private) package with your PAT as a registry
# credential (read:packages). See portainer-stack.yml.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image with, e.g. 2.2.1 (also tags :latest). Builds the selected ref's code — use it to publish a release whose tag predates this workflow, or to rebuild any version on demand."
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: pytest -q

  image:
    needs: test                       # never publish an image that fails tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag-push path: from tag v2.2.1 -> 2.2.1, 2.2, latest (flavor
          # latest=auto). Manual path: the supplied version + latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
