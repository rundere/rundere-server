# Release: build the image from this repo and publish it to GHCR, so Portainer
# pulls a real versioned artifact instead of a locally-built `yonder:latest`.
#
# Fires on a version tag (the same `vX.Y.Z` tags the release convention already
# pushes), and can be run by hand from the Actions tab (workflow_dispatch) —
# select the tag under "Use workflow from" to (re)publish an existing release,
# e.g. to backfill v2.2.1 which was tagged before this workflow existed.
#
# Also CALLED by cut-release.yml (workflow_call, `tag` input) right after it
# pushes a new tag — a tag pushed with GITHUB_TOKEN doesn't fire `push`, so the
# caller runs this directly; that path behaves exactly like a tag push.
#
# Push auth uses the built-in GITHUB_TOKEN (packages: write), so no PAT is
# needed. The image is ghcr.io/<this repository> and public (D-207), so pulling
# it needs no credential either. See docs/self-hosting.md.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to test, build, and publish as a release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image with, e.g. 2.2.1 (also tags :latest). Builds the selected ref's code — use it to publish a release whose tag predates this workflow, or to rebuild any version on demand."
        required: true
        type: string

# YONDER-295: read-only by default; each job asks for only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: pytest -q

  image:
    needs: test                       # never publish an image that fails tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # push to GHCR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag-push path: from tag v2.2.1 -> 2.2.1, 2.2, latest (flavor
          # latest=auto). Called path (cut-release): the same, from the `tag`
          # input. Manual path: the supplied version + latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only for a real tag push (not workflow_dispatch, which is for rebuilding/
  # backfilling a historical version and must not touch README or create an
  # out-of-order GitHub Release). Publishes the GitHub Release with
  # auto-generated notes, then syncs the version line in README/docs so they
  # never drift from pyproject.toml again. Issue tracking lives in Plane
  # (self-hosted, LAN-only) which GitHub-hosted runners can't reach — that
  # half of the release is done by hand (RELEASING.md, 'Syncing the tracker')
  # (see RELEASING.md).
  publish:
    needs: image
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Called path: main as it is NOW (the release commit), so the README
          # sync below fast-forwards main instead of branching off a stale sha.
          ref: ${{ inputs.tag != '' && 'main' || '' }}

      - name: Create GitHub Release
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json body -q .body > release-notes.md
          echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Sync version line in README and docs
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed -i -E "s/\*\*Version [0-9]+\.[0-9]+\.[0-9]+\*\*/**Version ${VERSION}**/" README.md
          sed -i -E "s/Current for \*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*/Current for **v${VERSION}**/" docs/howto.md
          if ! git diff --quiet -- README.md docs/howto.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md docs/howto.md
            git commit -m "chore: sync README/docs version to ${VERSION} [skip ci]"
            git push origin HEAD:main
          else
            echo "README/docs already at ${VERSION}, nothing to commit."
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
