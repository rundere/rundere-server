# Release: build the image from this repo and publish it to GHCR, so Portainer
# pulls a real versioned artifact instead of a locally-built `yonder:latest`.
#
# Fires on a version tag (the same `vX.Y.Z` tags the release convention already
# pushes), and can be run by hand from the Actions tab (workflow_dispatch) —
# select the tag under "Use workflow from" to (re)publish an existing release,
# e.g. to backfill v2.2.1 which was tagged before this workflow existed.
#
# Also CALLED by tag-release.yml (workflow_call, `tag` input) right after it
# pushes a new tag: a tag pushed with GITHUB_TOKEN doesn't fire `push`, so the
# caller runs this directly; that path behaves exactly like a tag push. It never
# pushes to main: the version line in README/docs rides in the release PR.
#
# Push auth uses the built-in GITHUB_TOKEN (packages: write), so no PAT is
# needed. The image is ghcr.io/<this repository> and public (D-207), so pulling
# it needs no credential either. See docs/self-hosting.md.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_call:
    inputs:
      tag:
        description: "The vX.Y.Z tag to test, build, and publish as a release"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the image with, e.g. 2.2.1 (also tags :latest). Builds the selected ref's code — use it to publish a release whose tag predates this workflow, or to rebuild any version on demand."
        required: true
        type: string

# YONDER-295: read-only by default; each job asks for only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - run: pytest -q

  image:
    needs: test                       # never publish an image that fails tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                 # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # Tag-push path: from tag v2.2.1 -> 2.2.1, 2.2, latest (flavor
          # latest=auto). Called path (cut-release): the same, from the `tag`
          # input. Manual path: the supplied version + latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=latest,enable=${{ inputs.tag != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only for a real tag push or a call from tag-release.yml (not
  # workflow_dispatch, which rebuilds or backfills a historical image and must
  # not create an out-of-order GitHub Release). Publishes the GitHub Release
  # with auto-generated notes. The README/docs version line is already right:
  # it rode in the release PR. Issue tracking lives in the maintainer's private
  # Plane, which GitHub-hosted runners can't reach, so that half of a release is
  # done by hand (RELEASING.md, 'Syncing the tracker').
  publish:
    needs: image
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Create GitHub Release
        id: gh_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, leaving it as-is."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json body -q .body > release-notes.md
          echo "notes-file=release-notes.md" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
