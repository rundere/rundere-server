# Cut a release from the Actions tab: Actions → "Cut release" → Run workflow.
#
# Every change to main goes through a PR, releases included (D-207, YONDER-295):
#
#  1. plan     — runs the pre-publish gate, works out the next version from
#                pyproject.toml (patch / minor / major, or an explicit X.Y.Z),
#                checks the tag is free, and writes the version + the merges
#                since the last tag to the run summary. With "publish" unticked
#                (the default) it stops here: a dry run.
#  2. prepare  — only when "publish" is ticked. Commits the version bump
#                (pyproject.toml, app/config.py, uv.lock) and the README/docs
#                version line to a `release/vX.Y.Z` branch and pushes that
#                branch, never main. The run summary links to open the PR.
#  3. You open and merge the PR. CI runs on it like any other (a PR opened with
#     the built-in token wouldn't trigger CI, and the repo doesn't let Actions
#     open PRs anyway). Merging it starts tag-release.yml, which tags the merge
#     commit and calls release.yml: tests, GHCR image, GitHub Release.
#
# The tracker sync stays manual (the maintainer's private Plane; RELEASING.md).
name: cut release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part to bump (ignored when version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Or an explicit version, e.g. 4.2.0 (optional)"
        type: string
        required: false
      publish:
        description: "Publish it (unticked = dry run: just show the plan)"
        type: boolean
        default: false

concurrency:
  group: cut-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false  # planning only; the release job pushes
      # YONDER-295: no release is cut from files with a blocking pre-publish
      # finding (secrets, personal data, the private denylist).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install .[dev]
      - name: pre-publish gate
        env:
          PREPUBLISH_DENYLIST: ${{ secrets.PREPUBLISH_DENYLIST }}
        run: python scripts/prepublish.py
      - name: Work out the next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
          WANT: ${{ inputs.version }}
        run: |
          CURRENT=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' pyproject.toml)
          APP=$(sed -nE 's/^    app_version: str = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' app/config.py)
          if [ -z "$CURRENT" ] || [ "$CURRENT" != "$APP" ]; then
            echo "::error::pyproject.toml ($CURRENT) and app/config.py ($APP) disagree"; exit 1
          fi
          IFS=. read -r MA MI PA <<< "$CURRENT"
          if [ -n "$WANT" ]; then
            NEXT="${WANT#v}"
            echo "$NEXT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version must be X.Y.Z"; exit 1; }
          else
            case "$BUMP" in
              major) NEXT="$((MA + 1)).0.0" ;;
              minor) NEXT="$MA.$((MI + 1)).0" ;;
              *)     NEXT="$MA.$MI.$((PA + 1))" ;;
            esac
          fi
          if git rev-parse -q --verify "refs/tags/v$NEXT" >/dev/null; then
            echo "::error::tag v$NEXT already exists"; exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$CURRENT" "$NEXT" | sort -V | tail -1)" != "$NEXT" ] || [ "$NEXT" = "$CURRENT" ]; then
            echo "::error::$NEXT is not newer than $CURRENT"; exit 1
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          {
            echo "## Release plan: $CURRENT → **$NEXT**"
            echo
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "Publishing: the \`prepare\` job pushes \`release/v$NEXT\`; open its PR from that job's summary."
            else
              echo "**Dry run**: no branch is pushed. Re-run with *publish* ticked to prepare the release PR."
            fi
            echo
            echo "### Merged since ${LAST:-the beginning}"
            git log --merges --first-parent --format='- %s' ${LAST:+$LAST..}origin/main | head -50
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    needs: plan
    if: inputs.publish
    runs-on: ubuntu-latest
    environment: release            # deploys from main only
    permissions:
      contents: write               # push the release/vX.Y.Z branch (not main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Bump the version on a release branch
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          BRANCH="release/v${VERSION}"
          git switch -c "$BRANCH"
          sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"${VERSION}\"/" pyproject.toml
          sed -i -E "s/^    app_version: str = \"[0-9]+\.[0-9]+\.[0-9]+\"/    app_version: str = \"${VERSION}\"/" app/config.py
          grep -q "^version = \"${VERSION}\"" pyproject.toml
          grep -q "app_version: str = \"${VERSION}\"" app/config.py
          # uv.lock records the project's own version too; bump it in step or
          # CI's `uv lock --check` fails (YONDER-194).
          sed -i -E '/^name = "yonder"$/{n;s/^version = "[0-9]+\.[0-9]+\.[0-9]+"/version = "'"${VERSION}"'"/}' uv.lock
          grep -A1 '^name = "yonder"$' uv.lock | grep -q "^version = \"${VERSION}\""
          # The version line in the README and the guide ride in the same PR.
          sed -i -E "s/\*\*Version [0-9]+\.[0-9]+\.[0-9]+\*\*/**Version ${VERSION}**/" README.md
          sed -i -E "s/Current for \*\*v[0-9]+\.[0-9]+\.[0-9]+\*\*/Current for **v${VERSION}**/" docs/howto.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml app/config.py uv.lock README.md docs/howto.md
          git commit -m "chore: release ${VERSION}"
          git push origin "$BRANCH"
          {
            echo "## Release ${VERSION} is ready for review"
            echo
            echo "[Open the release PR](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1&title=chore:%20release%20${VERSION})."
            echo "Merging it tags \`v${VERSION}\` and publishes the image and the GitHub Release (tag-release.yml)."
          } >> "$GITHUB_STEP_SUMMARY"
