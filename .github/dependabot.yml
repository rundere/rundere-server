# Dependency updates (YONDER-295). Weekly, grouped so a week's minor and patch
# bumps arrive as one PR per ecosystem; majors come one at a time. Security
# updates are separate and immediate (enable Dependabot security updates in the
# repo settings). Every PR still has to pass CI, prepublish included.
version: 2
updates:
  - package-ecosystem: "uv"           # pyproject.toml + uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"   # keeps the SHA pins current
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"       # the Dockerfile's base image
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(image)"
