{% for fl in fields %}
  {% if fl.is_textarea %}
  <div class="field">
    <label>{{ fl.label }}</label>
    <textarea class="input" name="{{ fl.key }}" rows="2">{{ fl.value }}</textarea>
  </div>
  {% else %}
  <div class="field">
    <label>{{ fl.label }}</label>
    <input class="input" type="{{ fl.type }}" name="{{ fl.key }}" value="{{ fl.value }}"
           {% if fl.hint %}placeholder="{{ fl.hint }}"{% endif %}>
    {% if fl.note %}<div class="bp-who-hint">{{ fl.note }}</div>{% endif %}
  </div>
  {% endif %}
{% endfor %}
