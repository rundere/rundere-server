{% extends "base.html" %}
{% block title %}Trips{% endblock %}
{% block content %}
<div class="bp-head">
  <h1 class="bp-h1">Trips</h1>
  <button class="btn btn-primary" hx-get="/trips/new" hx-target="#modal-root">+ New trip</button>
</div>

{% if has_any %}
<form id="trip-controls" class="bp-controls" onsubmit="return false">
  <input class="input bp-search" name="q" value="{{ q }}" placeholder="Search trips…"
         hx-get="/trips/list" hx-trigger="input changed delay:250ms, search"
         hx-target="#trip-groups" hx-include="#trip-controls">
  <div class="seg">
    {% for sf in status_filters %}
    <label class="seg-opt">
      <input type="radio" name="status" value="{{ sf.key }}" {% if sf.checked %}checked{% endif %}
             hx-get="/trips/list" hx-trigger="change"
             hx-target="#trip-groups" hx-include="#trip-controls">
      {{ sf.label }}
    </label>
    {% endfor %}
  </div>
</form>
{% endif %}

<div id="trip-groups">{% include "_groups.html" %}</div>
{% endblock %}
