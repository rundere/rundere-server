{% extends "base.html" %}
{% block title %}Trips{% endblock %}
{% block content %}
<div class="bp-head">
  <h1 class="bp-h1">Trips</h1>
  {% if not demo_mode() %}{# D-198 / YONDER-261 #}
  <button class="btn btn-primary" hx-get="/trips/new" hx-target="#modal-root">+ New trip</button>
  {% endif %}
</div>

{% if has_any %}
<form id="trip-controls" class="bp-controls" onsubmit="return false">
  <input class="input bp-search" type="search" name="q" value="{{ q }}" placeholder="Search trips…"
         hx-get="/trips/list" hx-trigger="input changed delay:250ms, search"
         hx-target="#trip-groups" hx-include="#trip-controls, #trip-status">
</form>
{% endif %}
<div id="trip-groups">{% include "_groups.html" %}</div>
{% endblock %}
