{# Add yourself as a NEW traveller (D-204). Self-service never picks an existing
   traveller: an admin links an account to one from Administer → Users. #}
<label for="new_traveler" style="display:block;margin:8px 0 4px">Your name as a traveller</label>
<input id="new_traveler" name="new_traveler" placeholder="e.g. Alex Rivera" autocomplete="name">
<p class="why">Already on someone's trips? Leave this empty and ask an admin to link your
  account to that traveller, so you don't end up listed twice.</p>
