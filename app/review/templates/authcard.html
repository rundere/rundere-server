<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · Run·dere</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/brand/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/icons/apple-touch-icon.png">
<link rel="manifest" href="/brand/icons/site.webmanifest">
<link rel="stylesheet" href="{{ asset('/brand/tokens/tokens.css') }}">
<link rel="stylesheet" href="{{ asset('/brand/fonts/fonts.css') }}">
<link rel="stylesheet" href="{{ asset('/review/static/theme.css') }}">
<script>
// No saved choice means dark, whatever the OS prefers (D-201).
(function(){var t;try{t=localStorage.getItem('tx-theme');}catch(e){}
  document.documentElement.setAttribute('data-theme',t||'dark');})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:12px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 18px}
label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin:12px 0 4px}
input,select{width:100%;background:var(--surface-sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:inherit;font-size:14px}
input:focus-visible,select:focus-visible{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:var(--accent)}
button{width:100%;margin-top:18px;padding:10px 12px;border-radius:var(--r);
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.05)}
.err{margin:14px 0 0;padding:9px 11px;border-radius:var(--r);
  background:var(--warn-bg);color:var(--warn);font-size:13px}
.ok{margin:14px 0 0;padding:9px 11px;border-radius:var(--r);
  background:var(--ok-bg);color:var(--ok);font-size:13px}
.links{margin-top:16px;display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
.links a{color:var(--accent);text-decoration:none}
.links a:hover{text-decoration:underline}
.hint{color:var(--ink-3);font-size:12px;margin:4px 0 0}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
