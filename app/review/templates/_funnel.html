{# Pipeline counts. Rendered inline in the topbar, and re-rendered
   out-of-band after every action so the numbers update without a refresh. #}
<div class="funnel" id="funnel"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div class="stage {% if counts.attention %}blocked{% else %}muted{% endif %}">
    <b>{{ counts.attention }}</b><span>need you</span>
  </div>
  <div class="stage {% if not counts.waiting %}muted{% endif %}">
    <b>{{ counts.waiting }}</b><span>waiting</span>
  </div>
  <div class="stage"><b>{{ counts.ready }}</b><span>ready to approve</span></div>
  <div class="stage {% if not counts.staged %}muted{% endif %}">
    <b>{{ counts.staged }}</b><span>approved</span>
  </div>
  <div class="stage muted"><b>{{ counts.all }}</b><span>total</span></div>
</div>
