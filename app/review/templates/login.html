<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Yonder</title>
<link rel="stylesheet" href="/review/static/theme.css">
<script>
(function(){try{var t=localStorage.getItem('tx-theme');
  if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
  font-family:var(--ui);font-size:14px;line-height:1.5;
  display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);padding:26px 24px}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:2px}
.brand h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--ink-3)}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 18px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin:12px 0 4px}
input{width:100%;background:var(--surface-sunk);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;font:inherit;font-size:14px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{width:100%;margin-top:18px;padding:10px 12px;border-radius:var(--r);
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  font:inherit;font-size:14px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.05)}
.err{margin:14px 0 0;padding:9px 11px;border-radius:var(--r);
  background:var(--warn-bg);color:var(--warn);font-size:13px}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="brand"><h1>Yonder</h1><span>sign in</span></div>
  <p class="sub">Sign in to your Yonder companion.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="username">Username</label>
  <input id="username" name="username" autocomplete="username" autofocus
         value="{{ username or '' }}" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
